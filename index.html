<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iqaku - The Ultimate Trilogy</title>
    
    <!-- Frameworks -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDK (Version 11.6.1) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Menempelkan fungsi ke window agar bisa diakses oleh Babel/React
        window.FirebaseBridge = { 
            initializeApp, getAuth, signInAnonymously, onAuthStateChanged, 
            signInWithCustomToken, getFirestore, collection, addDoc, 
            query, onSnapshot, doc, setDoc 
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,800;1,800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0;
            background: #1e3a8a;
            overflow-x: hidden;
        }

        .bg-luxury {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #f97316 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .shimmer-text {
            background: linear-gradient(90deg, #fff, #fb923c, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine { to { background-position: 200% center; } }
        
        .btn-sultan {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-sultan:active { transform: scale(0.92); }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="bg-luxury text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS (SVG Murni agar Ikonik & Cepat) ---
        const Icons = {
            Brain: () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.04-2.44 2.5 2.5 0 0 1-2-2.5 2.5 2.5 0 0 1 2-2.5 2.5 2.5 0 0 1 2-2.5 2.5 2.5 0 0 1 2.5-2.5z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.04-2.44 2.5 2.5 0 0 0 2-2.5 2.5 2.5 0 0 0-2-2.5 2.5 2.5 0 0 0-2-2.5 2.5 2.5 0 0 0-2.5-2.5z"/></svg>,
            Heart: () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.509 4.041 3 5.5l7 7Z"/></svg>,
            Star: () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
            Consult: () => <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8"/><path d="M8 13h6"/></svg>,
            Back: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>,
            Send: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        };

        // --- Configs & Data ---
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'iqaku-ultra';
        const apiKey = ""; 

        const generateBank = (type) => {
            const list = [];
            const db_template = {
                IQ: [
                    { q: "Jika 1, 3, 6, 10, 15, ..., angka selanjutnya adalah?", a: ["20", "21", "25", "18"], c: 1 },
                    { q: "SEMANGKA : MERAH = MELON : ...", a: ["Hijau", "Kuning", "Manis", "Bulat"], c: 1 },
                    { q: "Jika semua dokter pintar dan Budi adalah dokter, maka...", a: ["Budi pintar", "Budi sombong", "Budi sehat", "Semua yang pintar dokter"], c: 0 },
                    { q: "Lengkapi: 100, 95, 85, 70, ...", a: ["60", "55", "50", "45"], c: 2 }
                ],
                EQ: [
                    { q: "Teman Anda gagal ujian dan sangat sedih. Tindakan Anda?", a: ["Menyuruhnya jangan cengeng", "Mendengarkan keluh kesahnya", "Memberinya uang", "Pura-pura tidak tahu"], c: 1 },
                    { q: "Anda merasa marah karena dikritik. Cara mengatasinya?", a: ["Balas mengkritik", "Tarik napas & evaluasi pesan", "Langsung keluar ruangan", "Diam tapi dendam"], c: 1 },
                    { q: "Pentingnya mengakui kesalahan dalam tim adalah...", a: ["Tanda kelemahan", "Membangun kepercayaan", "Buang-buang waktu", "Hal yang memalukan"], c: 1 }
                ],
                SQ: [
                    { q: "Apa makna kejujuran bagi Anda?", a: ["Beban hidup", "Prinsip dasar integritas", "Tergantung situasi", "Hal yang ketinggalan zaman"], c: 1 },
                    { q: "Bagaimana Anda memandang keberagaman di Indonesia?", a: ["Ancaman", "Kekayaan bangsa", "Masalah sosial", "Hal yang tidak perlu"], c: 1 },
                    { q: "Saat melihat orang lain sukses, Anda merasa...", a: ["Iri dengki", "Terinspirasi & bersyukur", "Biasa saja", "Ingin menjatuhkan"], c: 1 }
                ]
            };
            for(let i=0; i<100; i++){
                const base = db_template[type][i % db_template[type].length];
                list.push({...base, id: `${type}-${i}`, q: `[Room ${type}] ${base.q}`});
            }
            return list;
        };

        const BANKS = { IQ: generateBank('IQ'), EQ: generateBank('EQ'), SQ: generateBank('SQ') };

        const App = () => {
            const [user, setUser] = useState(null);
            const [page, setPage] = useState('home');
            const [activeRoom, setActiveRoom] = useState(null);
            const [quizSet, setQuizSet] = useState([]);
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [history, setHistory] = useState([]);
            const [chat, setChat] = useState([{role:'ai', text:'Halo! Saya Wijaya. Siap menganalisis kondisi psikologis Anda hari ini?'}]);
            const [input, setInput] = useState('');
            const [isAiLoading, setIsAiLoading] = useState(false);
            const [systemLoading, setSystemLoading] = useState(true);
            const chatEnd = useRef(null);

            // --- Authentication & Data ---
            useEffect(() => {
                const interval = setInterval(() => {
                    if (window.FirebaseBridge) {
                        clearInterval(interval);
                        initFirebase();
                    }
                }, 100);
                return () => clearInterval(interval);
            }, []);

            const initFirebase = async () => {
                const { initializeApp, getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken, getFirestore, query, collection, onSnapshot } = window.FirebaseBridge;
                try {
                    const fbApp = initializeApp(firebaseConfig);
                    const auth = getAuth(fbApp);
                    
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (u) => {
                        setUser(u);
                        setSystemLoading(false);
                        if(u) {
                            const db = getFirestore(fbApp);
                            const q = query(collection(db, 'artifacts', appId, 'users', u.uid, 'results'));
                            onSnapshot(q, (snap) => {
                                setHistory(snap.docs.map(d => d.data()).sort((a,b) => new Date(b.date) - new Date(a.date)));
                            });
                        }
                    });
                } catch(e) { setSystemLoading(false); }
            };

            const startQuiz = (type) => {
                setActiveRoom(type);
                setQuizSet([...BANKS[type]].sort(() => 0.5 - Math.random()).slice(0, 10));
                setIdx(0); setScore(0); setPage('quiz');
            };

            const handleAnswer = async (ans) => {
                const correct = ans === quizSet[idx].c;
                const newScore = correct ? score + 1 : score;
                
                if(idx + 1 < quizSet.length) {
                    setScore(newScore);
                    setIdx(idx + 1);
                } else {
                    setScore(newScore);
                    setPage('result');
                    if(user && window.FirebaseBridge) {
                        const { getFirestore, collection, addDoc } = window.FirebaseBridge;
                        const db = getFirestore();
                        const finalVal = activeRoom === 'IQ' ? newScore * 6 + 90 : newScore * 10;
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'results'), {
                            score: finalVal, type: activeRoom, date: new Date().toISOString()
                        });
                    }
                }
            };

            const askAI = async () => {
                if(!input.trim() || isAiLoading) return;
                const txt = input; setInput('');
                setChat(p => [...p, {role:'user', text:txt}]);
                setIsAiLoading(true);

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: txt }] }],
                            systemInstruction: { parts: [{ text: "Anda adalah Wijaya, pakar psikologi elit. Gunakan bahasa yang mewah, cerdas, menenangkan, dan solutif." }] }
                        })
                    });
                    const d = await res.json();
                    setChat(p => [...p, {role:'ai', text: d.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, Wijaya sedang bermeditasi."}]);
                } catch(e) {
                    setChat(p => [...p, {role:'ai', text: "Gagal tersambung ke pusat data."}]);
                } finally { setIsAiLoading(false); }
            };

            useEffect(() => chatEnd.current?.scrollIntoView({ behavior: 'smooth' }), [chat]);

            if (systemLoading) return (
                <div className="h-screen flex items-center justify-center">
                    <div className="text-center">
                        <div className="w-16 h-16 border-4 border-white border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
                        <p className="font-black tracking-[0.4em] uppercase opacity-60">Initializing Suite...</p>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto min-h-screen px-6 pt-12 pb-20">
                    {page === 'home' && (
                        <div className="animate-in fade-in duration-700">
                            <header className="text-center mb-16">
                                <h1 className="text-8xl font-black italic tracking-tighter drop-shadow-2xl shimmer-text">iqaku</h1>
                                <p className="text-[10px] tracking-[0.5em] opacity-70 font-bold uppercase mt-2">Elite Psychological Suite</p>
                            </header>

                            <div className="glass-panel p-8 rounded-[3rem] mb-10 relative overflow-hidden group">
                                <h3 className="text-2xl font-black italic underline decoration-orange-500 decoration-4 underline-offset-8 mb-6 uppercase">Dashboard</h3>
                                <div className="grid grid-cols-3 gap-3 text-center">
                                    {['IQ', 'EQ', 'SQ'].map(r => (
                                        <div key={r} className="bg-white/5 p-4 rounded-3xl border border-white/10 shadow-inner">
                                            <p className="text-[10px] font-black opacity-50 mb-1">{r}</p>
                                            <p className="text-2xl font-black italic">{history.find(h => h.type === r)?.score || '-'}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-4">
                                <button onClick={() => startQuiz('IQ')} className="w-full bg-white text-blue-900 p-8 rounded-[3rem] font-black text-2xl flex justify-between items-center px-10 shadow-2xl btn-sultan group">
                                    <span className="flex items-center gap-4 italic"><Icons.Brain /> IQ ROOM</span>
                                    <Icons.Back className="rotate-180 group-hover:translate-x-2 transition-transform" />
                                </button>
                                <div className="grid grid-cols-2 gap-4">
                                    <button onClick={() => startQuiz('EQ')} className="glass-panel p-6 rounded-[2.5rem] font-black italic flex flex-col items-center gap-2 btn-sultan hover:bg-white/10">
                                        <Icons.Heart /> <span className="uppercase text-xs tracking-widest">EQ Room</span>
                                    </button>
                                    <button onClick={() => startQuiz('SQ')} className="glass-panel p-6 rounded-[2.5rem] font-black italic flex flex-col items-center gap-2 btn-sultan hover:bg-white/10">
                                        <Icons.Star /> <span className="uppercase text-xs tracking-widest">SQ Room</span>
                                    </button>
                                </div>
                                <button onClick={() => setPage('chat')} className="w-full bg-orange-500 p-8 rounded-[3rem] font-black text-2xl flex items-center justify-center gap-4 shadow-xl shadow-orange-900/40 btn-sultan italic tracking-tighter uppercase">
                                    <Icons.Consult /> Konsultasi AI
                                </button>
                            </div>
                        </div>
                    )}

                    {page === 'quiz' && (
                        <div className="animate-in slide-in-from-right duration-500 pt-8">
                            <div className="flex justify-between items-center mb-8 px-4 font-black italic text-[10px] opacity-70 uppercase tracking-widest">
                                <span>{activeRoom} ASSESSMENT</span>
                                <span>{idx + 1} / 10</span>
                            </div>
                            <div className="w-full h-3 bg-white/10 rounded-full mb-12 p-0.5 overflow-hidden border border-white/5 shadow-inner">
                                <div className="h-full bg-orange-500 rounded-full transition-all duration-700" style={{ width: `${(idx + 1) * 10}%` }}></div>
                            </div>
                            <div className="glass-panel p-10 rounded-[4rem] relative">
                                <div className="absolute -top-6 -left-4 bg-white text-blue-900 px-6 py-2 rounded-2xl font-black italic text-[10px] uppercase shadow-2xl tracking-tighter">Question {idx + 1}</div>
                                <h2 className="text-3xl font-black italic leading-tight mb-12 mt-6 tracking-tight">"{quizSet[idx]?.q}"</h2>
                                <div className="space-y-4">
                                    {quizSet[idx]?.a.map((opt, i) => (
                                        <button key={i} onClick={() => handleAnswer(i)} className="w-full text-left p-6 rounded-[1.8rem] bg-white/5 hover:bg-white/15 border border-white/10 transition-all font-black text-sm flex items-center gap-6 group btn-sultan">
                                            <span className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center group-hover:bg-orange-500 transition-all text-orange-400 border border-white/5">{String.fromCharCode(65 + i)}</span>
                                            {opt}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {page === 'result' && (
                        <div className="h-screen flex flex-col items-center justify-center text-center animate-in zoom-in duration-500">
                            <div className="glass-panel p-12 rounded-[5rem] w-full relative">
                                <TrophyIcon />
                                <h1 className="text-4xl font-black italic mb-2 tracking-tighter uppercase leading-none mt-6">Final Analysis</h1>
                                <p className="text-[10px] tracking-[0.5em] opacity-60 mb-10 font-black uppercase tracking-widest">Intelligence Standard // Wijaya Lab</p>
                                <div className="text-[130px] font-black italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white to-orange-400 leading-none my-10 drop-shadow-2xl">
                                    {activeRoom === 'IQ' ? score * 6 + 90 : score * 10}
                                </div>
                                <button onClick={() => setPage('home')} className="w-full bg-white text-blue-900 p-7 rounded-[3rem] font-black text-2xl uppercase italic btn-sultan shadow-2xl">Return to Core</button>
                            </div>
                        </div>
                    )}

                    {page === 'chat' && (
                        <div className="h-screen flex flex-col pt-4 animate-in slide-in-from-right duration-500">
