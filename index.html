            const [aiMode, setAiMode] = useState('wijaya');
            const [cat, setCat] = useState(null);
            const [questions, setQuestions] = useState([]);
            const [idx, setIdx] = useState(0);
            const [ans, setAns] = useState([]);
            const [msgs, setMsgs] = useState([]);
            const [input, setInput] = useState('');
            const [typing, setTyping] = useState(false);
            const scrollRef = useRef(null);

            const [h, setH] = useState(''); const [w, setW] = useState(''); const [bmi, setBmi] = useState(null);
            const [fHits, setFHits] = useState(0); const [fPos, setFPos] = useState(null);

            useEffect(() => { if(view==='splash') setTimeout(()=>setView('menu'), 2500); }, [view]);
            useEffect(() => { scrollRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs, typing]);
            useEffect(() => {
                const welcome = aiMode === 'wijaya' 
                    ? { role: 'assistant', text: 'Yo! Gue Wijaya. Siap bongkar potensi IQ dan fisik lo biar makin fungsional. 😎', ai: 'wijaya' }
                    : { role: 'assistant', text: 'Halo, aku Nura. Aku di sini untuk mendengarkan isi hatimu dengan tenang. Mari bercerita padaku. 🌿', ai: 'nura' };
                setMsgs([welcome]);
            }, [aiMode]);

            const shuffleAndStart = (c) => {
                const pool = [...MASTER_BANK[c]].sort(() => 0.5 - Math.random());
                setQuestions(pool.slice(0, 10));
                setCat(c); setIdx(0); setAns([]); setView('quiz');
            };

            const startFocus = () => { setFHits(0); setCat('FOCUS'); setView('focus'); spawn(); };
            const spawn = () => { setFPos(null); setTimeout(()=> setFPos({x: Math.random()*80+10, y: Math.random()*80+10}), 1000); };
            const hit = () => { setFHits(h => h+1); if(fHits < 4) spawn(); else setView('result'); };

            const calculate = () => {
                if(cat === 'HEALTH') return bmi.val;
                if(cat === 'FOCUS') return 800 + (fHits * 40);
                const correct = ans.filter((a,i) => a === questions[i].c).length;
                return (cat.startsWith('IQ')) ? (95 + (correct * 15)) : (correct * 50);
            };

            const sendMsg = async (txt, sticker = null) => {
                const query = txt || input; if(!query.trim() && !sticker) return;
                setMsgs(p => [...p, { role: 'user', text: query, sticker }]);
                setInput(''); setTyping(true); setView('chat');

                const system = aiMode === 'wijaya'
                    ? "Nama kamu Wijaya. Gaya gaul (gue/lo). Jawaban HARUS fungsional, sains-based, to the point (maks 2-3 kalimat). Kirim sticker di akhir [sticker:emoji]."
                    : "Nama kamu Nura. Gaya lembut, empatik, psikolog (aku/kamu). Dengarkan user & beri saran mental fungsional. Jangan sebut kamu AI. Kirim sticker di akhir [sticker:emoji].";

                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            contents: [{parts: [{text: query}]}],
                            systemInstruction: {parts: [{text: system}]}
                        })
                    });
                    const data = await response.json();
                    let reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Maaf, daya pikir sedang menurun.";
                    let foundSticker = null;
                    const match = reply.match(/\[sticker:(.+)\]/);
                    if(match) { foundSticker = match[1]; reply = reply.replace(match[0], '').trim(); }
                    setMsgs(p => [...p, { role: 'assistant', text: reply, sticker: foundSticker, ai: aiMode }]);
                } catch { setMsgs(p => [...p, { role: 'assistant', text: "Koneksi terputus.", ai: aiMode }]); }

            return (
