<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wijaya & Nura IQ</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-600 to-orange-500 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const apiKey = "AIzaSyClmquwvdNE6a3Y4s8_durpg4j9LqV163w";

        const App = () => {
            const [step, setStep] = React.useState('start');
            const [currentQ, setCurrentQ] = React.useState(0);
            const [score, setScore] = React.useState(0);

            const questions = [
                { q: "Lengkapi deret: 2, 4, 8, 16, ...", a: ["24", "32", "48"], c: 1 },
                { q: "Jika semua mawar adalah bunga, dan beberapa bunga layu, maka?", a: ["Mawar pasti layu", "Beberapa mawar mungkin layu", "Mawar tidak bisa layu"], c: 1 },
                { q: "Manakah yang tidak termasuk kelompoknya?", a: ["Semangka", "Melon", "Ayam"], c: 2 }
            ];

            const handleAnswer = (idx) => {
                if(idx === questions[currentQ].c) setScore(score + 10);
                if(currentQ + 1 < questions.length) {
                    setCurrentQ(currentQ + 1);
                } else {
                    setStep('result');
                }
            };

            if(step === 'start') return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6">
                    <div className="glass p-10 rounded-3xl text-center text-white shadow-2xl">
                        <h1 className="text-5xl font-extrabold mb-2">iqaku</h1>
                        <p className="text-lg mb-8 opacity-90">WIJAYA & NURA PSYCHOLOGY TEST</p>
                        <button onClick={() => setStep('quiz')} className="bg-white text-blue-600 px-10 py-4 rounded-full font-bold text-xl shadow-lg hover:scale-105 transition">
                            MULAI TES
                        </button>
                    </div>
                </div>
            );

            if(step === 'quiz') return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6">
                    <div className="glass p-8 rounded-3xl w-full max-w-md text-white">
                        <div className="mb-6 flex justify-between items-center text-sm">
                            <span>Soal {currentQ + 1} dari {questions.length}</span>
                            <span className="bg-white/30 px-3 py-1 rounded-full">Skor: {score}</span>
                        </div>
                        <h2 className="text-2xl font-bold mb-6 leading-tight">{questions[currentQ].q}</h2>
                        <div className="space-y-4">
                            {questions[currentQ].a.map((opt, i) => (
                                <button key={i} onClick={() => handleAnswer(i)} className="w-full text-left p-4 rounded-2xl bg-white/10 hover:bg-white/30 border border-white/20 transition">
                                    {opt}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6">
                    <div className="glass p-10 rounded-3xl text-center text-white shadow-2xl">
                        <h1 className="text-4xl font-bold mb-2">HASIL TES</h1>
                        <div className="text-6xl font-black my-6">{score * 4 + 60}</div>
                        <p className="text-xl mb-8">IQ Anda Terkategorikan Luar Biasa!</p>
                        <button onClick={() => window.location.reload()} className="bg-orange-400 text-white px-8 py-3 rounded-full font-bold shadow-lg">
                            COBA LAGI
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
